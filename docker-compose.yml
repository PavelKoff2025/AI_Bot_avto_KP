services:
  # Flask API — http://127.0.0.1:5001
  # Образ: ${DOCKERHUB_IMAGE_API:-ai-auogeneration:latest}
  api:
    build: .
    image: ${DOCKERHUB_IMAGE_API:-ai-auogeneration:latest}
    container_name: ai-auogeneration-api
    command: ["api"]
    ports:
      # На macOS :5000 часто занят AirPlay — снаружи 5001
      - "${API_HOST_PORT:-5001}:5000"
    env_file:
      - .env
    environment:
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5000"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-600}"
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Go API — http://127.0.0.1:5002
  go-api:
    build:
      context: .
      dockerfile: go_server/Dockerfile
    image: ${DOCKERHUB_IMAGE_GO:-ai-auogeneration-go:latest}
    container_name: ai-auogeneration-go-api
    ports:
      - "${GO_API_HOST_PORT:-5002}:5001"
    env_file:
      - .env
    environment:
      GO_SERVER_HOST: "0.0.0.0"
      GO_SERVER_PORT: "5001"
      PROJECT_ROOT: "/app"
      PYTHON_BIN: "python3"
      BRIDGE_SCRIPT: "/app/go_server/bridge/generate.py"
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Telegram-бот (тот же образ, что Flask api):
  #   docker compose --profile bot up -d
  bot:
    profiles: ["bot"]
    image: ${DOCKERHUB_IMAGE_API:-ai-auogeneration:latest}
    build: .
    container_name: ai-auogeneration-bot
    command: ["bot"]
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    restart: unless-stopped
